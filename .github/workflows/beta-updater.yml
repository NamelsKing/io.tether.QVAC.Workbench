name: Beta updater

# Proposes a pull request against `beta` when QVAC publishes a newer, verified
# staging Flatpak. It never merges; a human reviews and merges.
# Code comes from the trusted default-branch commit; the beta checkout is data only.
# See .github/beta-updater/README.md.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "pr opens the beta pull request; patch only uploads a reviewable patch"
        type: choice
        options:
          - pr
          - patch
        default: pr

permissions: {}

concurrency:
  group: beta-updater
  cancel-in-progress: false

jobs:
  update:
    # Never run a copy of this workflow from a fork or from a non-default branch.
    if: github.repository == 'flathub/io.tether.QVAC.Workbench' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      MANIFEST: io.tether.QVAC.Workbench.yml
      MODE: ${{ inputs.mode || vars.BETA_UPDATER_MODE || 'pr' }}
    steps:
      - name: Check mode
        run: |
          case "$MODE" in
            pr|patch) ;;
            *) echo "BETA_UPDATER_MODE must be 'pr' or 'patch', got '$MODE'" >&2; exit 1 ;;
          esac

      - name: Check out the trusted default-branch commit (code)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out beta (data only, never executed)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: beta
          path: beta
          persist-credentials: false

      - name: List versions that already have an updater pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --base beta --state all --limit 200 \
            --json headRefName \
            --jq '.[].headRefName | select(startswith("beta-update/")) | ltrimstr("beta-update/")' \
            > "$RUNNER_TEMP/proposed.txt"

      - name: Select and verify the newest staging publication
        id: update
        run: |
          python3 -I trusted/.github/beta-updater/update_beta.py \
            --master "trusted/$MANIFEST" \
            --beta-dir beta \
            --proposed "$RUNNER_TEMP/proposed.txt" \
            --pr-body "$RUNNER_TEMP/pr-body.md" \
            --master-rev "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Build reviewable patch
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git -C beta diff --no-color --no-ext-diff --no-textconv -- "$MANIFEST" > "$RUNNER_TEMP/beta-update.patch"
          test -s "$RUNNER_TEMP/beta-update.patch"

      - name: Upload patch
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-update-${{ steps.update.outputs.version }}
          path: ${{ runner.temp }}/beta-update.patch
          retention-days: 14
          if-no-files-found: error

      - name: Open the beta pull request
        if: steps.update.outputs.changed == 'true' && env.MODE == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.update.outputs.branch }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git -C beta config user.name "github-actions[bot]"
          git -C beta config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -C beta ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Branch $BRANCH already exists; opening the pull request from it."
          else
            git -C beta switch -c "$BRANCH"
            git -C beta add -- "$MANIFEST"
            git -C beta commit -m "Update QV.AC beta to $VERSION" \
              -m "Generated by .github/beta-updater from the verified staging publication."
            git -C beta push origin "HEAD:refs/heads/$BRANCH"
          fi
          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base beta --head "$BRANCH" \
            --title "Update QV.AC beta to $VERSION" --body-file "$RUNNER_TEMP/pr-body.md")"
          echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          new_number="${url##*/}"
          gh pr list --repo "$GITHUB_REPOSITORY" --base beta --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("beta-update/")) | "\(.number) \(.headRefName)"' |
            while read -r number head; do
              if [ "$head" != "$BRANCH" ]; then
                gh pr close --repo "$GITHUB_REPOSITORY" "$number" --comment "Superseded by #$new_number ($VERSION)."
              fi
            done

      - name: Note patch-only run
        if: steps.update.outputs.changed == 'true' && env.MODE == 'patch'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          echo "Patch mode: no branch or pull request was created. Download the beta-update-$VERSION artifact and review it with git apply on the beta branch." >> "$GITHUB_STEP_SUMMARY"
